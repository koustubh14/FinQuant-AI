[project]
name = "finquant-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "numpy>=2.2,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2", "yfinance>=0.2.65,<1", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
